openapi: 3.0.3
info:
  title: Shop API — интернет-магазин канцтоваров
  version: 1.0.0
  description: |
    Единственный источник правды по контракту (ТЗ, раздел 3).
    Правки — только через MR с апрувом обоих треков.

    Договорённости:
    - Деньги — целые тенге (int). Бонусы: 1 бонус = 1 ₸.
    - Даты — ISO 8601 UTC.
    - Телефоны — E.164: +7XXXXXXXXXX.
    - Пагинация: ?page&limit → {items, meta:{page, limit, total}}.
    - Ошибки: {"error":{"code":"...","message":"...","details":{}}}.
      Реестр кодов — api_logic_v1.md, раздел 6.
    - Публичные эндпоинты (каталог/поиск/конфиг) работают без токена.
    - Цены/остатки/скидки считает только сервер.
servers:
  - url: http://localhost:4010/api/v1
    description: Prism mock
  - url: https://api-staging.SHOP.kz/api/v1
    description: Staging
  - url: https://api.SHOP.kz/api/v1
    description: Production
tags:
  - name: auth
  - name: config
  - name: catalog
  - name: cart
  - name: orders
  - name: payments
  - name: profile
  - name: bonuses
  - name: favorites
  - name: devices
  - name: admin

paths:
  # ─────────────────────────── AUTH ───────────────────────────
  /auth/otp/request:
    post:
      tags: [auth]
      summary: Запросить SMS-код
      operationId: otpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, pattern: '^\+7\d{10}$', example: '+77071234567' }
                channel: { type: string, enum: [whatsapp, sms], default: whatsapp, description: 'Куда слать код; сервер может сфолбэчить на sms' }
      responses:
        '200':
          description: Код отправлен
          content:
            application/json:
              schema:
                type: object
                required: [retry_after, channel]
                properties:
                  retry_after: { type: integer, description: 'Секунд до повторной отправки', example: 60 }
                  channel: { type: string, enum: [whatsapp, sms], description: 'Куда реально отправлен код (нет WhatsApp → sms)' }
        '429':
          $ref: '#/components/responses/Error429'
        '422':
          $ref: '#/components/responses/Error422'

  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Проверить код, получить токены
      operationId: otpVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, pattern: '^\+7\d{10}$' }
                code: { type: string, minLength: 4, maxLength: 4 }
      responses:
        '200':
          description: Успех. Если пользователь новый — создаётся.
          content:
            application/json:
              schema:
                type: object
                required: [tokens, user, is_new]
                properties:
                  tokens: { $ref: '#/components/schemas/Tokens' }
                  user: { $ref: '#/components/schemas/User' }
                  is_new: { type: boolean }
        '400':
          description: 'OTP_INVALID | OTP_EXPIRED | OTP_ATTEMPTS_EXCEEDED'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Обновить пару токенов (ротация refresh)
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Новая пара
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401':
          $ref: '#/components/responses/Error401'

  # ─────────────────────────── CONFIG ───────────────────────────
  /config:
    get:
      tags: [config]
      summary: Публичная конфигурация приложения
      operationId: getConfig
      responses:
        '200':
          description: Конфиг (кэшировать в приложении на сессию)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }

  # ─────────────────────────── CATALOG ───────────────────────────
  /categories:
    get:
      tags: [catalog]
      summary: Дерево категорий (2 уровня)
      operationId: getCategories
      responses:
        '200':
          description: Только активные, отсортированы по sort
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
              example:
                items:
                  - { id: 1, parent_id: null, name: 'Письменные принадлежности', slug: 'pismennye', image: 'https://cdn.shop.kz/cat/1.webp', sort: 1,
                      children: [ { id: 11, parent_id: 1, name: 'Ручки шариковые', slug: 'ruchki-sharikovye', image: null, sort: 1, children: [] } ] }

  /products:
    get:
      tags: [catalog]
      summary: Листинг / поиск товаров
      operationId: getProducts
      parameters:
        - { name: category_id, in: query, schema: { type: integer }, description: 'Подкатегория или корневая (включая детей)' }
        - { name: search, in: query, schema: { type: string }, description: 'FTS + trgm по name/sku/description' }
        - { name: sort, in: query, schema: { type: string, enum: [popular, price_asc, price_desc, new], default: popular } }
        - { name: min_price, in: query, schema: { type: integer } }
        - { name: max_price, in: query, schema: { type: integer } }
        - { name: in_stock, in: query, schema: { type: boolean }, description: 'true — скрыть stock=0' }
        - { name: attrs, in: query, schema: { type: string }, description: 'URL-encoded JSON-объект, напр. {"Бренд":"ErichKrause","Цвет":"Синий"}' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: 'stock=0 всегда в конце выдачи. is_favorite=false для гостя. bonus_amount — по уровню запросившего (гость = базовый).'
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCard' }
                  meta: { $ref: '#/components/schemas/Meta' }
              example:
                items:
                  - { id: 17, name: 'Ручка шариковая ErichKrause R-301, синяя', sku: 'EK-R301-BL', price: 190, old_price: 250,
                      image: 'https://cdn.shop.kz/p/17/card.webp', stock: 143, bonus_amount: 5, is_favorite: false }
                meta: { page: 1, limit: 24, total: 312 }

  /products/facets:
    get:
      tags: [catalog]
      summary: Доступные фильтры для категории (для шторки фильтров)
      operationId: getProductFacets
      parameters:
        - { name: category_id, in: query, required: true, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Диапазон цен и значения атрибутов по активным товарам выборки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facets' }
              example:
                price: { min: 90, max: 12500 }
                attributes:
                  - { key: 'Бренд', values: [ { value: 'ErichKrause', count: 42 }, { value: 'Berlingo', count: 17 } ] }
                  - { key: 'Цвет', values: [ { value: 'Синий', count: 30 } ] }

  /products/{id}:
    get:
      tags: [catalog]
      summary: Карточка товара
      operationId: getProduct
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 'similar: та же подкатегория, in stock, цена ±40%, топ продаж, ≤10 шт.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404':
          $ref: '#/components/responses/Error404'

  /search/suggest:
    get:
      tags: [catalog]
      summary: Подсказки поиска (от 2 символов, debounce на клиенте 300 мс)
      operationId: searchSuggest
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        '200':
          description: До 5 товаров + до 5 текстовых подсказок
          content:
            application/json:
              schema:
                type: object
                required: [queries, products]
                properties:
                  queries:
                    type: array
                    items: { type: string }
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/ProductMini' }

  /banners:
    get:
      tags: [catalog]
      summary: Баннеры главной (активные, в периоде показа)
      operationId: getBanners
      responses:
        '200':
          description: Отсортированы по sort
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Banner' }

  /collections/{key}:
    get:
      tags: [catalog]
      summary: 'Подборки главной: hits | new | sale'
      operationId: getCollection
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, enum: [hits, new, sale] } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 'hits: топ sales_count; new: по created_at; sale: есть old_price. Только in stock.'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCard' }

  # ─────────────────────────── CART ───────────────────────────
  /cart/calculate:
    post:
      tags: [cart]
      summary: Серверный пересчёт корзины (единственный источник итогов)
      description: |
        Вызывается при открытии корзины, любом изменении состава/промокода/бонусов
        и на checkout (с delivery_type). Невалидный промокод НЕ роняет запрос:
        promo.applied=false + promo.error_code, итоги считаются без него.
        Гость: bonus.max_allowed=0, bonus_will_earn по базовому уровню.
      operationId: cartCalculate
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartCalculateRequest' }
      responses:
        '200':
          description: Итоги
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartCalculateResponse' }
              example:
                items:
                  - { product_id: 17, name: 'Ручка ErichKrause R-301', image: 'https://cdn.shop.kz/p/17/thumb.webp',
                      price: 190, qty: 10, sum: 1900, stock: 143, available: true }
                unavailable: [ { product_id: 45, reason: out_of_stock } ]
                promo: { code: 'SCHOOL10', applied: true, discount: 190, error_code: null }
                bonus: { requested: 500, applied: 500, max_allowed: 513, balance: 2100 }
                totals: { items_total: 1900, promo_discount: 190, bonus_spent: 500,
                          delivery_price: 1500, total: 2710, bonus_will_earn: 12 }
                price_changed: false

  # ─────────────────────────── ORDERS ───────────────────────────
  /orders:
    post:
      tags: [orders]
      summary: Создать заказ
      description: |
        Заголовок Idempotency-Key (UUID, генерирует клиент) обязателен: повтор с тем же
        ключом возвращает уже созданный заказ (200), не создавая новый.
        Сервер полностью пересчитывает корзину; если total ≠ client_total →
        409 PRICE_CHANGED c актуальным calculate в details. Остатки резервируются
        в транзакции создания. Неоплаченный online-заказ автоотменяется через 30 мин.
      operationId: createOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '201':
          description: Создан (200 — если вернули существующий по Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: 'PRICE_CHANGED | OUT_OF_STOCK — в details свежий calculate'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Error422'
    get:
      tags: [orders]
      summary: Мои заказы
      operationId: listOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Новые сверху
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrderShort' }
                  meta: { $ref: '#/components/schemas/Meta' }

  /orders/{id}:
    get:
      tags: [orders]
      summary: Детали заказа
      operationId: getOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Только свой заказ (иначе 404)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          $ref: '#/components/responses/Error404'

  /orders/{id}/cancel:
    post:
      tags: [orders]
      summary: Отменить заказ (только status=new)
      operationId: cancelOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Отменён, остатки и бонусы возвращены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: ORDER_NOT_CANCELLABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{id}/pay:
    post:
      tags: [orders]
      summary: Получить ссылку на оплату
      description: |
        payment_url Каспи открывать внешним приложением (LaunchMode.externalApplication) —
        ссылку перехватит установленный Kaspi.kz. Возврат ловим по AppLifecycleState.resumed
        (returnUrl — серверная страница-заглушка, не deeplink), затем поллинг GET /orders/{id}
        (2с, до 90с) до payment_status ∈ {paid, failed}. Истина — webhook/сверка с Kaspi.
        Детали — kaspi_pay_integration.md.
      operationId: payOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Ссылка действительна до payment_expires_at заказа
          content:
            application/json:
              schema:
                type: object
                required: [payment_url]
                properties:
                  payment_url: { type: string, format: uri }
        '409':
          description: 'ALREADY_PAID | ORDER_NOT_PAYABLE'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ─────────────────────────── PAYMENTS ───────────────────────────
  /payments/webhook/{provider}:
    post:
      tags: [payments]
      summary: Webhook платёжного провайдера (S2S)
      description: |
        provider: kaspi. Тело — как присылает провайдер
        (парсит адаптер PaymentProvider). Подпись проверяется ДО обработки, невалидная → 403.
        Идемпотентность по external_id платежа: повтор → 200 без побочных эффектов.
      operationId: paymentWebhook
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Принято
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '403':
          description: Невалидная подпись

  # ─────────────────────────── PROFILE / BONUSES / FAVORITES / DEVICES ─────────
  /me:
    get:
      tags: [profile]
      summary: Мой профиль
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    put:
      tags: [profile]
      summary: Обновить профиль (телефон менять нельзя)
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email, nullable: true }
                birth_date: { type: string, format: date, nullable: true }
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422':
          $ref: '#/components/responses/Error422'
    delete:
      tags: [profile]
      summary: Удалить аккаунт (soft-delete + анонимизация ПДн)
      operationId: deleteMe
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Удалён, токены отозваны

  /me/bonuses:
    get:
      tags: [bonuses]
      summary: Бонусный счёт, уровень, прогресс
      operationId: getBonuses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Данные для экрана «Бонусы» и плашек
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BonusAccount' }
              example:
                balance: 2100
                lifetime_spent: 87600
                tier: { threshold: 50000, percent: 1 }
                next_tier: { threshold: 100000, percent: 3, remaining: 12400 }
                expiring_soon: { amount: 300, date: '2026-09-01' }

  /me/bonuses/transactions:
    get:
      tags: [bonuses]
      summary: История бонусных операций
      operationId: getBonusTransactions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Новые сверху
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BonusTransaction' }
                  meta: { $ref: '#/components/schemas/Meta' }

  /favorites:
    get:
      tags: [favorites]
      summary: Избранное
      operationId: getFavorites
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Карточки товаров
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCard' }
                  meta: { $ref: '#/components/schemas/Meta' }

  /favorites/{product_id}:
    put:
      tags: [favorites]
      summary: Добавить в избранное (идемпотентно)
      operationId: addFavorite
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: integer } }
      responses:
        '204':
          description: Добавлено
    delete:
      tags: [favorites]
      summary: Убрать из избранного (идемпотентно)
      operationId: removeFavorite
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: integer } }
      responses:
        '204':
          description: Убрано

  /devices:
    post:
      tags: [devices]
      summary: Зарегистрировать/обновить FCM-токен (upsert по токену)
      operationId: registerDevice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token, platform]
              properties:
                fcm_token: { type: string }
                platform: { type: string, enum: [ios, android] }
      responses:
        '204':
          description: Сохранён

  # ═══════════════════════════ ADMIN ═══════════════════════════
  /admin/auth/login:
    post:
      tags: [admin]
      summary: Вход в админку (email + пароль)
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 'JWT с ролью admin | manager'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401':
          $ref: '#/components/responses/Error401'

  /admin/dashboard:
    get:
      tags: [admin]
      summary: Дашборд
      operationId: adminDashboard
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }

  /admin/products:
    get:
      tags: [admin]
      summary: Товары (таблица)
      operationId: adminListProducts
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string }, description: 'name | sku | barcode' }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - { name: in_stock, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [updated, name, price, stock, sales], default: updated } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductAdmin' }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [admin]
      summary: Создать товар
      operationId: adminCreateProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductAdmin' }
        '409':
          description: SKU_EXISTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Error422'

  /admin/products/{id}:
    get:
      tags: [admin]
      summary: Товар
      operationId: adminGetProduct
      security: [{ bearerAuth: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200':
          description: Товар
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductAdmin' }
        '404':
          $ref: '#/components/responses/Error404'
    put:
      tags: [admin]
      summary: Обновить товар (полная замена)
      operationId: adminUpdateProduct
      security: [{ bearerAuth: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Обновлён (кэш каталога инвалидирован)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductAdmin' }
    delete:
      tags: [admin]
      summary: Скрыть товар (is_active=false; физически не удаляем — есть в заказах)
      operationId: adminDeleteProduct
      security: [{ bearerAuth: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '204':
          description: Скрыт

  /admin/products/import:
    post:
      tags: [admin]
      summary: XLSX-импорт (создать/обновить по SKU)
      description: |
        Шаблон колонок: sku*, name*, category_path* («Родитель / Подкатегория»),
        price*, old_price, stock*, weight_g, barcode, description, attr:Ключ (любое число колонок).
        dry_run=true — только проверка, ничего не пишем, возвращаем отчёт.
        Ошибочные строки пропускаются, остальные применяются; отчёт всегда полный.
      operationId: adminImportProducts
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean, default: true } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Отчёт импорта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }

  /admin/products/export:
    get:
      tags: [admin]
      summary: XLSX-экспорт каталога (тот же шаблон, что импорт)
      operationId: adminExportProducts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Файл
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /admin/products/bulk:
