# ═══════════════════════════ COMPONENTS ═══════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 24 }

  responses:
    Error401:
      description: 'TOKEN_INVALID | TOKEN_EXPIRED'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error404:
      description: NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error422:
      description: 'VALIDATION_ERROR — details.fields: {поле: сообщение}'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error429:
      description: 'RATE_LIMITED — details.retry_after: секунды'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: 'OUT_OF_STOCK' }
            message: { type: string, description: 'Человекочитаемо, RU, можно показывать пользователю' }
            details: { type: object, additionalProperties: true, nullable: true }

    Meta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    Tokens:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: 'Секунд жизни access', example: 1800 }

    User:
      type: object
      required: [id, phone]
      properties:
        id: { type: integer }
        phone: { type: string, example: '+77071234567' }
        name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        birth_date: { type: string, format: date, nullable: true }

    Category:
      type: object
      required: [id, parent_id, name, slug, sort]
      properties:
        id: { type: integer }
        parent_id: { type: integer, nullable: true }
        name: { type: string }
        slug: { type: string }
        image: { type: string, format: uri, nullable: true }
        sort: { type: integer }
        is_active: { type: boolean, description: 'Только в админке' }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    ProductMini:
      type: object
      required: [id, name, price]
      properties:
        id: { type: integer }
        name: { type: string }
        image: { type: string, format: uri, nullable: true, description: 'thumb 200px' }
        price: { type: integer }

    ProductCard:
      type: object
      required: [id, name, sku, price, stock, bonus_amount, is_favorite]
      properties:
        id: { type: integer }
        name: { type: string }
        sku: { type: string }
        price: { type: integer }
        old_price: { type: integer, nullable: true }
        image: { type: string, format: uri, nullable: true, description: 'card 500px' }
        stock: { type: integer, description: 'Клиент: 0 → «Нет в наличии», ≤10 → «Осталось X», иначе «В наличии»' }
        bonus_amount: { type: integer, description: 'floor(price × tier%) запросившего; гость — базовый уровень' }
        is_favorite: { type: boolean }

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          required: [images, attributes, description, category, similar]
          properties:
            description: { type: string }
            images:
              type: array
              items: { type: string, format: uri }
              description: 'full 1200px, по порядку'
            attributes:
              type: array
              items: { $ref: '#/components/schemas/AttributeKV' }
              description: 'Порядок = порядок отображения'
            category:
              type: object
              required: [id, name]
              properties:
                id: { type: integer }
                name: { type: string }
            similar:
              type: array
              items: { $ref: '#/components/schemas/ProductCard' }

    AttributeKV:
      type: object
      required: [key, value]
      properties:
        key: { type: string, example: 'Бренд' }
        value: { type: string, example: 'ErichKrause' }

    Facets:
      type: object
      required: [price, attributes]
      properties:
        price:
          type: object
          required: [min, max]
          properties:
            min: { type: integer }
            max: { type: integer }
        attributes:
          type: array
          items:
            type: object
            required: [key, values]
            properties:
              key: { type: string }
              values:
                type: array
                items:
                  type: object
                  required: [value, count]
                  properties:
                    value: { type: string }
                    count: { type: integer }

    Banner:
      type: object
      required: [id, image, link_type, link_value]
      properties:
        id: { type: integer }
        image: { type: string, format: uri }
        link_type: { type: string, enum: [category, product, url, none] }
        link_value: { type: string, nullable: true, description: 'id категории/товара или URL' }
        sort: { type: integer }
        is_active: { type: boolean }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }

    BannerInput:
      type: object
      required: [image, link_type]
      properties:
        image: { type: string, format: uri, description: 'из /admin/uploads' }
        link_type: { type: string, enum: [category, product, url, none] }
        link_value: { type: string, nullable: true }
        sort: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }

    AppConfig:
      type: object
      required: [store, delivery, bonus, payment, legal]
      properties:
        store:
          type: object
          properties:
            name: { type: string }
            phone: { type: string }
            whatsapp_phone: { type: string, description: 'для wa.me' }
            pickup_address: { type: string }
            work_hours: { type: string, example: 'Пн–Сб 9:00–19:00' }
        delivery:
          type: object
          properties:
            methods:
              type: array
              description: 'Что показывать в чекауте; порядок = порядок в списке'
              items:
                type: object
                properties:
                  code: { type: string, enum: [pickup, courier, kazpost] }
                  title: { type: string, example: 'Курьером по Астане' }
                  enabled: { type: boolean }
            courier_price: { type: integer, example: 1500 }
            courier_free_from: { type: integer, example: 20000, description: 'Сравнивается с items_total − promo_discount' }
            kazpost_note: { type: string, example: 'Казпочтой по РК, 3–7 дней, тариф по весу' }
        bonus:
          type: object
          properties:
            redeem_limit_percent: { type: integer, example: 30 }
            tiers:
              type: array
              items: { $ref: '#/components/schemas/BonusTier' }
        payment:
          type: object
          properties:
            methods:
              type: array
              description: 'Что показывать в чекауте; порядок = порядок в списке'
              items:
                type: object
                properties:
                  code: { type: string, enum: [kaspi] }
                  title: { type: string, example: 'Kaspi Pay' }
                  enabled: { type: boolean }
        legal:
          type: object
          properties:
            offer_url: { type: string, format: uri }
            privacy_url: { type: string, format: uri }
        min_app_version:
          type: object
          properties:
            ios: { type: string, example: '1.0.0' }
            android: { type: string, example: '1.0.0' }

    CartCalculateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, qty]
            properties:
              product_id: { type: integer }
              qty: { type: integer, minimum: 1, maximum: 999 }
              price: { type: integer, nullable: true, description: 'Последняя цена, которую видел клиент — для флага price_changed' }
        promo_code: { type: string, nullable: true }
        bonus_to_spend: { type: integer, nullable: true, minimum: 0 }
        delivery_type: { type: string, enum: [pickup, courier, kazpost], default: pickup }
        destination:
          type: object
          nullable: true
          description: 'Обязателен для kazpost — иначе totals.delivery_price = null'
          properties:
            city: { type: string }
            index: { type: string, description: 'Почтовый индекс' }

    CalculatedItem:
      type: object
      required: [product_id, name, price, qty, sum, stock, available]
      properties:
        product_id: { type: integer }
        name: { type: string }
        image: { type: string, format: uri, nullable: true }
        price: { type: integer, description: 'Актуальная серверная цена' }
        qty: { type: integer, description: 'Может быть урезан до stock' }
        sum: { type: integer }
        stock: { type: integer }
        available: { type: boolean }

    CartCalculateResponse:
      type: object
      required: [items, unavailable, promo, bonus, totals, price_changed]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CalculatedItem' }
        unavailable:
          type: array
          items:
            type: object
            required: [product_id, reason]
            properties:
              product_id: { type: integer }
              reason: { type: string, enum: [out_of_stock, inactive, not_found] }
        promo:
          type: object
          nullable: true
          required: [code, applied, discount]
          properties:
            code: { type: string }
            applied: { type: boolean }
            discount: { type: integer }
            error_code: { type: string, nullable: true, description: 'PROMO_NOT_FOUND | PROMO_EXPIRED | PROMO_MIN_ORDER | PROMO_LIMIT_REACHED | PROMO_USER_LIMIT' }
        bonus:
          type: object
          required: [requested, applied, max_allowed, balance]
          properties:
            requested: { type: integer }
            applied: { type: integer, description: 'min(requested, max_allowed, balance)' }
            max_allowed: { type: integer, description: 'floor(redeem_limit% × (items_total − promo_discount))' }
            balance: { type: integer }
        totals:
          type: object
          required: [items_total, promo_discount, bonus_spent, delivery_price, total, bonus_will_earn]
          properties:
            items_total: { type: integer }
            promo_discount: { type: integer }
            bonus_spent: { type: integer }
            delivery_price: { type: integer, nullable: true, description: 'null — kazpost без destination; пока null, заказ оформить нельзя' }
            total: { type: integer, nullable: true }
            bonus_will_earn: { type: integer, description: 'floor(tier% × (items_total − promo_discount − bonus_spent))' }
        price_changed: { type: boolean, description: 'true, если серверная цена ≠ price из запроса хотя бы по одной позиции' }

    OrderStatus:
      type: string
      enum: [new, confirmed, assembling, ready_for_pickup, delivering, done, cancelled]

    PaymentStatus:
      type: string
      enum: [pending, paid, failed, refunded]

    OrderCreateRequest:
      type: object
      required: [items, delivery_type, recipient, payment_method, client_total]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, qty]
            properties:
              product_id: { type: integer }
              qty: { type: integer, minimum: 1 }
        delivery_type: { type: string, enum: [pickup, courier, kazpost] }
        address:
          type: object
          nullable: true
          description: 'courier: street, house. kazpost: city, index, street, house'
          properties:
            city: { type: string, nullable: true }
            index: { type: string, nullable: true }
            street: { type: string }
            house: { type: string }
            apartment: { type: string, nullable: true }
            comment: { type: string, nullable: true }
        recipient:
          type: object
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { type: string, pattern: '^\+7\d{10}$' }
        payment_method: { type: string, enum: [kaspi], description: 'MVP: только Kaspi Pay; список методов — из /config' }
        promo_code: { type: string, nullable: true }
        bonus_to_spend: { type: integer, nullable: true, minimum: 0 }
        client_total: { type: integer, description: 'Итог, который видел пользователь; при расхождении → 409 PRICE_CHANGED' }

    OrderItem:
      type: object
      required: [product_id, name, price, qty, sum]
      properties:
        product_id: { type: integer }
        name: { type: string, description: 'Снапшот на момент заказа' }
        image: { type: string, format: uri, nullable: true }
        price: { type: integer, description: 'Снапшот' }
        qty: { type: integer }
        sum: { type: integer }

    OrderTotals:
      type: object
      required: [items_total, promo_discount, bonus_spent, delivery_price, total]
      properties:
        items_total: { type: integer }
        promo_discount: { type: integer }
        bonus_spent: { type: integer }
        delivery_price: { type: integer }
        total: { type: integer }

    Order:
      type: object
      required: [id, number, status, payment_method, payment_status, delivery_type, recipient, items, totals, bonus_earned, can_cancel, created_at]
      properties:
        id: { type: integer }
        number: { type: string, example: 'ORD-2026-000123' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        payment_method: { type: string, enum: [kaspi] }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        payment_expires_at: { type: string, format: date-time, nullable: true, description: 'Дедлайн оплаты online-заказа' }
        delivery_type: { type: string, enum: [pickup, courier, kazpost] }
        address:
          type: object
          nullable: true
          additionalProperties: true
        recipient:
          type: object
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        totals: { $ref: '#/components/schemas/OrderTotals' }
        bonus_earned: { type: integer, description: 'Зафиксирован при создании, зачисляется при done' }
        promo_code: { type: string, nullable: true }
        receipt_url: { type: string, format: uri, nullable: true, description: 'Чек ОФД, появляется после paid' }
        track_number: { type: string, nullable: true, description: 'Трек Казпочты, появляется при delivering' }
        can_cancel: { type: boolean, description: 'status=new' }
        user: { $ref: '#/components/schemas/User', description: 'Только в /admin/*' }
        created_at: { type: string, format: date-time }

    OrderShort:
      type: object
      required: [id, number, status, payment_status, total, items_count, created_at]
      properties:
        id: { type: integer }
        number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        total: { type: integer }
        items_count: { type: integer }
        item_images:
          type: array
          items: { type: string, format: uri }
          maxItems: 3
        created_at: { type: string, format: date-time }

    BonusTier:
      type: object
      required: [threshold, percent]
      properties:
        threshold: { type: integer, description: 'Накоплено покупок от, ₸', example: 50000 }
        percent: { type: number, example: 1 }

    BonusAccount:
      type: object
      required: [balance, lifetime_spent, tier]
      properties:
        balance: { type: integer }
        lifetime_spent: { type: integer, description: 'Сумма товарной части выполненных заказов, оплаченная деньгами' }
        tier: { $ref: '#/components/schemas/BonusTier' }
        next_tier:
          allOf:
            - $ref: '#/components/schemas/BonusTier'
            - type: object
              properties:
                remaining: { type: integer, description: 'Сколько осталось до порога' }
          nullable: true
        expiring_soon:
          type: object
          nullable: true
          properties:
            amount: { type: integer }
            date: { type: string, format: date }

    BonusTransaction:
      type: object
      required: [id, type, amount, created_at]
      properties:
        id: { type: integer }
        type: { type: string, enum: [accrual, redeem, expire, adjust, revert] }
        amount: { type: integer, description: 'accrual/adjust+ положительный; redeem/expire/adjust− отрицательный' }
        order_number: { type: string, nullable: true }
        comment: { type: string, nullable: true }
        expires_at: { type: string, format: date, nullable: true, description: 'Для accrual' }
        created_at: { type: string, format: date-time }

    PromoCodeInput:
      type: object
      required: [code, type, value]
      properties:
        code: { type: string, minLength: 3, maxLength: 32 }
        type: { type: string, enum: [percent, fixed] }
        value: { type: integer, description: 'percent: 1–100; fixed: ₸' }
        min_order: { type: integer, default: 0 }
        valid_from: { type: string, format: date-time, nullable: true }
        valid_to: { type: string, format: date-time, nullable: true }
        usage_limit: { type: integer, nullable: true }
        per_user_limit: { type: integer, nullable: true, default: 1 }
        stacks_with_bonus: { type: boolean, default: true }
        is_active: { type: boolean, default: true }

    PromoCode:
      allOf:
        - $ref: '#/components/schemas/PromoCodeInput'
        - type: object
          required: [id, used_count]
          properties:
            id: { type: integer }
            used_count: { type: integer }

    ProductInput:
      type: object
      required: [category_id, sku, name, price, stock]
      properties:
        category_id: { type: integer, description: 'Только подкатегория (2-й уровень)' }
        sku: { type: string }
        barcode: { type: string, nullable: true }
        name: { type: string, maxLength: 300 }
        description: { type: string, nullable: true }
        price: { type: integer, minimum: 1 }
        old_price: { type: integer, nullable: true, description: 'Должна быть > price' }
        stock: { type: integer, minimum: 0 }
        weight_g: { type: integer, nullable: true, description: 'Вес, г — для тарифа Казпочты; null → default_weight_g из настроек' }
        attributes:
          type: array
          items: { $ref: '#/components/schemas/AttributeKV' }
        images:
          type: array
          items: { type: string, format: uri }
          maxItems: 10
          description: 'URL из /admin/uploads, порядок = порядок показа'
        is_active: { type: boolean, default: true }

    ProductAdmin:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, sales_count, created_at, updated_at]
          properties:
            id: { type: integer }
            sales_count: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    CategoryInput:
      type: object
      required: [name]
      properties:
        parent_id: { type: integer, nullable: true }
        name: { type: string }
        image: { type: string, format: uri, nullable: true }
        sort: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }

    ImportResult:
      type: object
      required: [dry_run, total_rows, created, updated, errors]
      properties:
        dry_run: { type: boolean }
        total_rows: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [row, error]
            properties:
              row: { type: integer }
              sku: { type: string, nullable: true }
              error: { type: string, example: 'Категория «Канцелярия / Степлеры» не найдена' }
        import_id: { type: integer, nullable: true, description: 'null при dry_run' }

    ImportLog:
      type: object
      required: [id, filename, created_rows, updated_rows, errors_count, created_at]
      properties:
        id: { type: integer }
        filename: { type: string }
        created_rows: { type: integer }
        updated_rows: { type: integer }
        errors_count: { type: integer }
        created_at: { type: string, format: date-time }

    UserAdmin:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            is_blocked: { type: boolean }
            orders_count: { type: integer }
            orders_total: { type: integer }
            bonus_balance: { type: integer }
            lifetime_spent: { type: integer }
            created_at: { type: string, format: date-time }

    Dashboard:
      type: object
      required: [today, week, orders_by_status, top_products]
      properties:
        today:
          type: object
          properties:
            orders: { type: integer }
            revenue: { type: integer }
        week:
          type: object
          properties:
            orders: { type: integer }
            revenue: { type: integer }
            avg_check: { type: integer }
        orders_by_status:
          type: object
          additionalProperties: { type: integer }
        top_products:
          type: array
          items:
            type: object
            properties:
              product_id: { type: integer }
              name: { type: string }
              qty: { type: integer }
              revenue: { type: integer }

    Settings:
      type: object
      required: [store, delivery, bonus, payment, legal]
      properties:
        store:
          type: object
          properties:
            name: { type: string }
            phone: { type: string }
            whatsapp_phone: { type: string }
            pickup_address: { type: string }
            work_hours: { type: string }
        delivery:
          type: object
          properties:
            methods_enabled:
              type: object
              additionalProperties: { type: boolean }
              description: '{pickup, courier, kazpost}'
            courier_price: { type: integer }
            courier_free_from: { type: integer }
            default_weight_g: { type: integer, example: 200 }
        bonus:
          type: object
          properties:
            redeem_limit_percent: { type: integer }
            expiry_days: { type: integer, example: 180 }
        payment:
          type: object
          properties:
            methods_enabled:
              type: object
              additionalProperties: { type: boolean }
              description: '{kaspi}; ключи/секреты провайдера — в k8s Secrets, не здесь'
        legal:
          type: object
          properties:
            offer_url: { type: string }
            privacy_url: { type: string }
        min_app_version:
          type: object
          properties:
            ios: { type: string }
            android: { type: string }
