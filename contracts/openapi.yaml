      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, filter]
              properties:
                action: { type: string, enum: [price_percent, stock_set, activate, deactivate] }
                filter:
                  type: object
                  properties:
                    category_id: { type: integer, nullable: true }
                    product_ids:
                      type: array
                      items: { type: integer }
                      nullable: true
                value: { type: number, nullable: true, description: 'price_percent: ±N (проценты); stock_set: значение' }
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer }

